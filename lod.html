<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>低模驗收 — Contrails Air: Combat</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1620;
        font: 13px/1.5 ui-monospace, Consolas, monospace; color: #cfe0ef; }
      /* 【一定要給尺寸】只寫 display:block 的話畫布停在預設的 300x150，
         整個被面板蓋住 —— 畫面全黑，看起來像模型沒載入 */
      canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
      #panel {
        position: fixed; top: 12px; left: 12px; width: 290px; padding: 12px 14px;
        background: rgba(10,18,26,0.82); border: 1px solid #2b3f52; border-radius: 6px;
        backdrop-filter: blur(4px);
      }
      #panel h1 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; color: #8fb8d8; }
      .row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
      .row label { flex: 0 0 68px; color: #8ea6bb; }
      .row input[type=range] { flex: 1; min-width: 0; }
      .row .val { flex: 0 0 68px; text-align: right; color: #e6f0f8; }
      button {
        font: inherit; color: #cfe0ef; background: #16283a; border: 1px solid #2b3f52;
        border-radius: 4px; padding: 4px 9px; cursor: pointer; white-space: nowrap;
      }
      button:hover { background: #1e364c; }
      button.on { background: #2d5a86; border-color: #4f8ec0; }
      #stats { margin-top: 10px; padding-top: 9px; border-top: 1px solid #2b3f52;
        color: #8ea6bb; white-space: pre; }
      #hint { position: fixed; bottom: 12px; left: 12px; color: #5f7e99; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="panel">
      <h1>低模驗收</h1>
      <div class="row" id="planes"></div>
      <div class="row">
        <label>距離</label>
        <input type="range" id="dist" min="20" max="4000" step="25" value="1500" />
        <span class="val" id="distV">1500 m</span>
      </div>
      <div class="row">
        <button id="mSide">並排</button>
        <button id="mOver">疊合</button>
        <button id="mFlip">交替</button>
      </div>
      <div class="row">
        <button id="vSide">側視</button>
        <button id="vTop">俯視</button>
        <button id="vFront">前視</button>
        <button id="vQtr">四三</button>
      </div>
      <div class="row">
        <button id="spin">自轉</button>
        <button id="wire">線框</button>
      </div>
      <div class="row" id="sky"></div>
      <div id="stats"></div>
    </div>
    <div id="hint">左鍵拖曳旋轉　滾輪縮放　右鍵平移　　距離滑桿換算的是「在 1280x720、FOV 65° 下這一架佔幾個像素」　　低模的切換門檻是 200 m</div>
    <script type="module" src="/src/tools/lod.ts"></script>
  </body>
</html>
