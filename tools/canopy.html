<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>林子遠近展示區 — Contrails Air: Combat</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1620;
        font: 13px/1.5 ui-monospace, Consolas, monospace; color: #cfe0ef; }
      /* 【一定要給尺寸】只寫 display:block 的話畫布停在預設的 300x150 */
      canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
      #panel {
        position: fixed; top: 12px; left: 12px; width: 330px; padding: 12px 14px;
        background: rgba(10,18,26,0.85); border: 1px solid #2b3f52; border-radius: 6px;
      }
      #panel h1 { margin: 0 0 8px; font-size: 13px; letter-spacing: .08em; color: #8fb8d8; }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0; }
      .row > label { flex: 0 0 64px; color: #8ea6bb; }
      .row input[type=range] { flex: 1; min-width: 0; }
      .row .val { flex: 0 0 64px; text-align: right; color: #e6f0f8; }
      button {
        font: inherit; color: #cfe0ef; background: #16283a; border: 1px solid #2b3f52;
        border-radius: 4px; padding: 3px 8px; cursor: pointer; white-space: nowrap;
      }
      button:hover { background: #1e364c; }
      button.on { background: #2d5a86; border-color: #4f8ec0; }
      .tag { position: fixed; transform: translate(-50%, -100%); padding: 2px 6px; pointer-events: none;
        background: rgba(10,18,26,0.78); border: 1px solid #2b3f52; border-radius: 4px;
        white-space: pre; text-align: center; color: #e6f0f8; }
      #hint { position: fixed; bottom: 12px; left: 12px; color: #5f7e99; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="panel">
      <h1>林子遠近展示區</h1>
      <div class="row"><label>整套</label><span id="set"></span></div>
      <div class="row"><label>時段</label><span id="tod"></span></div>
      <div class="row"><label>樹種</label><span id="species"></span></div>
      <div class="row"><label>鏡頭</label><span id="presetSide"></span></div>
      <div class="row"><label></label><span id="presetElev"></span></div>
      <div class="row">
        <label>方位</label>
        <input type="range" id="az" min="0" max="180" step="1" value="0" />
        <span class="val" id="azV"></span>
      </div>
      <div class="row">
        <label>俯角</label>
        <input type="range" id="elev" min="2" max="90" step="1" value="15" />
        <span class="val" id="elevV"></span>
      </div>
      <div class="row">
        <label>距離</label>
        <input type="range" id="dist" min="1000" max="25000" step="500" value="4000" />
        <span class="val" id="distV"></span>
      </div>
      <div class="row">
        <label>林子深度</label>
        <input type="range" id="depth" min="480" max="4000" step="80" value="480" />
        <span class="val" id="depthV"></span>
      </div>
      <div class="row"><label>點</label><span id="pointK"></span></div>
      <div class="row"><label>點的底色</label><span id="pointCal"></span></div>
      <div class="row">
        <label>林子遮擋</label>
        <input type="range" id="blocking" min="0" max="0.04" step="0.001" value="0" />
        <span class="val" id="blockingV"></span>
      </div>
      <div class="row"><label>算式反光</label><span id="specular"></span></div>
      <div class="row"><label>算式形狀</label><span id="shape"></span></div>
      <div class="row"><label>烘圖</label><span id="bake"></span></div>
      <div class="row"><label>林間空隙</label><span id="gap"></span></div>
      <div class="row">
        <label>空隙修正</label>
        <input type="range" id="gapScale" min="0.5" max="2" step="0.05" value="1" />
        <span class="val" id="gapScaleV"></span>
      </div>
      <div class="row"><label>霧</label><span id="fog"></span></div>
    </div>
    <div id="hint">四塊是同一片林子、同一批樹，只換畫法。標籤上的數字是那一塊的平均亮度（含樹之間的地），括號是與立體樹的差</div>
    <script type="module" src="/src/tools/canopy.ts"></script>
  </body>
</html>
