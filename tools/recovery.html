<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>改出試驗場 — Contrails Air: Combat</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1620;
        font: 13px/1.5 ui-monospace, Consolas, monospace; color: #cfe0ef; }
      canvas { display: block; }
      .box {
        position: fixed; padding: 12px 14px; box-sizing: border-box;
        background: rgba(10,18,26,0.86); border: 1px solid #2b3f52; border-radius: 6px;
      }
      #panel { top: 12px; left: 12px; width: 300px; max-height: calc(100% - 24px);
        overflow-y: auto; overflow-x: hidden; }
      #readout { top: 12px; right: 12px; width: 300px; white-space: pre; color: #8ea6bb; }
      #panel h1 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; color: #8fb8d8; }
      #panel h2 { margin: 12px 0 4px; font-size: 12px; color: #6f93b3; font-weight: normal; }
      .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      .row label { flex: 0 0 76px; color: #8ea6bb; }
      .row label.check { flex: 1; cursor: pointer; }
      .row input[type=range] { flex: 1; min-width: 0; }
      .row .val { flex: 0 0 64px; text-align: right; color: #e6f0f8; }
      select, button {
        font: inherit; color: #cfe0ef; background: #16283a; border: 1px solid #2b3f52;
        border-radius: 4px; padding: 3px 8px;
      }
      select { flex: 1; min-width: 0; }
      button { cursor: pointer; flex: 1; }
      button:hover { background: #1e364c; }
      button.on { background: #2d5a86; border-color: #4f8ec0; }
      .legend { display: flex; gap: 14px; margin-top: 8px; }
      .legend span::before { content: ''; display: inline-block; width: 14px; height: 3px;
        margin-right: 5px; vertical-align: middle; background: var(--c); }
      details summary { cursor: pointer; color: #6f93b3; margin-top: 10px; }
      #hint { position: fixed; bottom: 12px; left: 12px; color: #5f7e99; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="panel" class="box">
      <h1>改出試驗場</h1>
      <div class="row"><label>機種</label><select id="spec"></select></div>
      <div class="row"><label>接管前意圖</label>
        <select id="intent">
          <option value="strafe">對地俯衝（瞄地面落點）</option>
          <option value="turn">維持轉彎（持續拉桿）</option>
        </select>
      </div>

      <h2>初始姿態</h2>
      <div class="row"><label>離地高度</label><input type="range" id="alt" min="30" max="2000" step="10" value="400" /><span class="val" id="altV"></span></div>
      <div class="row"><label>速度</label><input type="range" id="tas" min="60" max="220" step="5" value="120" /><span class="val" id="tasV"></span></div>
      <div class="row"><label>俯衝角</label><input type="range" id="gamma" min="-89" max="0" step="1" value="-15" /><span class="val" id="gammaV"></span></div>
      <div class="row"><label>坡度</label><input type="range" id="bank" min="0" max="180" step="5" value="0" /><span class="val" id="bankV"></span></div>
      <div class="row"><label>滾轉角速度</label><input type="range" id="rollRate" min="-120" max="120" step="10" value="0" /><span class="val" id="rollRateV"></span></div>
      <div class="row"><label>初始過載</label><input type="range" id="load" min="1" max="7" step="0.5" value="1" /><span class="val" id="loadV"></span></div>

      <h2>60 Hz 物理預演</h2>
      <div class="row"><label class="check"><input type="checkbox" id="latch" checked /> 接管撐到垂直速度 ≥ 0 才放手</label></div>
      <div class="row"><label>固定餘裕</label><input type="range" id="margin" min="0" max="200" step="5" value="30" /><span class="val" id="marginV"></span></div>
      <div class="row"><label>預演設定</label><span>每 0.1 s 重算，60 Hz 子步，直到止跌</span></div>

      <h2>播放</h2>
      <div class="row"><label>速率</label><input type="range" id="rate" min="0.1" max="3" step="0.1" value="1" /><span class="val" id="rateV"></span></div>
      <div class="row"><button id="replay">重播 R</button><button id="pause">暫停 ␣</button><button id="follow" class="on">跟隨</button></div>

      <div class="legend">
        <span style="--c:#e8913a">現行（×1.5＋120 m）</span>
        <span style="--c:#4fd1e0">物理預演</span>
      </div>
    </div>
    <div id="readout" class="box"></div>
    <div id="hint">左鍵拖曳旋轉　滾輪縮放　右鍵平移　｜　圓盤 = 預估所需高度　亮線 = 接管中</div>
    <script type="module" src="/src/tools/recovery.ts"></script>
  </body>
</html>
