<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>魚雷展示區 — Contrails Air: Combat</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1620;
        font: 13px/1.5 ui-monospace, Consolas, monospace; color: #cfe0ef; }
      canvas { display: block; }
      #panel {
        position: fixed; top: 12px; left: 12px; width: 300px; padding: 12px 14px;
        background: rgba(10,18,26,0.82); border: 1px solid #2b3f52; border-radius: 6px;
        backdrop-filter: blur(4px); max-height: calc(100vh - 44px); overflow-y: auto;
      }
      #panel h1 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; color: #8fb8d8; }
      #panel h2 { margin: 12px 0 6px; font-size: 11px; letter-spacing: .1em;
        color: #6f93b2; border-top: 1px solid #22374a; padding-top: 8px; }
      #view, #tod { display: flex; gap: 6px; margin-bottom: 8px; }
      #view button, #tod button { flex: 1; padding: 4px 2px; }
      #fire { width: 100%; margin-bottom: 6px; padding: 6px; font-weight: bold; }
      .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
      .row label { flex: 0 0 74px; color: #8ea6bb; }
      .row input[type=range] { flex: 1; min-width: 0; }
      .row .val { flex: 0 0 56px; text-align: right; color: #e6f0f8; }
      .chk { display: flex; align-items: center; gap: 6px; margin: 6px 0; color: #8ea6bb; }
      button {
        font: inherit; color: #cfe0ef; background: #16283a; border: 1px solid #2b3f52;
        border-radius: 4px; padding: 4px 9px; cursor: pointer;
      }
      button:hover { background: #1e364c; }
      button.on { background: #2d5a86; border-color: #4f8ec0; }
      #dump {
        position: fixed; right: 12px; bottom: 12px; width: 264px; padding: 10px 12px;
        background: rgba(10,18,26,0.82); border: 1px solid #2b3f52; border-radius: 6px;
        backdrop-filter: blur(4px);
      }
      #dump .head { display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 8px; color: #8fb8d8; }
      #out { margin: 0; font-size: 11px; line-height: 1.4; color: #a9c4dc;
        white-space: pre; overflow-x: auto; max-height: 40vh; overflow-y: auto; }
      #hint { position: fixed; bottom: 12px; left: 12px; color: #5f7e99; }
      #live { position: fixed; top: 12px; right: 12px; color: #5f7e99; text-align: right;
        white-space: pre; }
      #gate { display: inline-block; padding: 1px 7px; border-radius: 3px;
        font-weight: bold; }
      .ok { background: rgba(125,251,168,0.18); color: #7dfba8; }
      .bad { background: rgba(255,90,77,0.18); color: #ff5a4d; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="panel">
      <h1>魚雷展示區</h1>
      <button id="fire">重播　(空白鍵)</button>
      <h2>鏡頭</h2>
      <div id="view"></div>
      <div id="tod"></div>
      <h2>投放</h2>
      <div id="release"></div>
      <h2>目標</h2>
      <div id="target"></div>
      <h2>魚雷</h2>
      <div id="torp"></div>
      <h2>引爆的水冠</h2>
      <div id="rows"></div>
    </div>
    <div id="dump">
      <div class="head"><span>設定</span><button id="copy">複製</button></div>
      <pre id="out"></pre>
    </div>
    <div id="live"></div>
    <div id="hint">左鍵拖曳旋轉　滾輪縮放　右鍵平移　空白鍵重播</div>
    <script type="module" src="/src/tools/torpedo.ts"></script>
  </body>
</html>
