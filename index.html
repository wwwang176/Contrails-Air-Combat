<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contrails Air: Combat</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e14; }
      canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      /* 【非有不可】上面那條 `canvas { display: block }` 是作者樣式，
         會壓過 [hidden] 的 UA 樣式 —— 少了這一行，選單期間 HUD 藏不起來 */
      #hud[hidden] { display: none; }
      #board {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: rgba(6, 10, 16, 0.72); pointer-events: none;
        font: 13px/1.5 ui-monospace, Consolas, monospace; color: #cfe0ef;
      }
      #board[hidden] { display: none; }
      #banner { font-size: 34px; letter-spacing: .18em; font-weight: 700; }
      #banner.victory { color: #7fd4a0; }
      #banner.defeat { color: #e08a8a; }
      #banner:empty { display: none; }
      #tables { display: flex; gap: 28px; align-items: flex-start; }
      #board table { border-collapse: collapse; min-width: 300px; }
      #board caption {
        text-align: left; padding-bottom: 4px; letter-spacing: .1em; font-weight: 700;
      }
      #board table.blue caption { color: #7fb2e0; }
      #board table.red caption { color: #e08a8a; }
      #board th {
        text-align: right; font-weight: 400; color: #6f8ba5;
        border-bottom: 1px solid #2b3f52; padding: 2px 8px;
      }
      #board th.name { text-align: left; }
      #board td { padding: 1px 8px; text-align: right; }
      #board td.name { text-align: left; }
      #board tr.dead { color: #5c6f80; }
      #board tr.me { background: rgba(90, 150, 210, 0.22); color: #eaf4ff; }
      #ui {
        position: fixed; inset: 0; z-index: 2;
        font: 15px/1.6 ui-monospace, Consolas, "Noto Sans TC", sans-serif;
        color: #cfe0ef;
        /* 【容器本身不吃點擊】它蓋滿整個畫面而且在最上層。不關掉的話，
           戰鬥中（所有 section 都藏著）它會擋掉底下結算板的兩個按鈕 */
        pointer-events: none;
      }
      #ui .screen {
        position: absolute; inset: 0; pointer-events: auto;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px;
        background: rgba(6, 10, 16, 0.55);
        /* 【內容比視窗高就捲動】遭遇戰的設定頁在 1280×720 是 793 px：
           八台機種讓「加一架」那一排多了一列，把「開始戰鬥」擠到 y=747。
           `justify-content: center` 在溢出時會把兩端都切掉 —— 上緣的標題
           看不見，下緣的按鈕**點不到**。`safe center` 讓它在溢出時退回
           靠上對齊，捲動才到得了底部（2026-09-03，八台機種進編之後）。 */
        overflow-y: auto;
        justify-content: safe center;
        padding: 24px 0;
      }
      #ui .screen[hidden] { display: none; }
      #ui h1.title {
        margin: 0; font-size: 54px; letter-spacing: .28em; font-weight: 700;
        color: #eaf4ff;
      }
      #ui .subtitle { margin: 0; letter-spacing: .3em; color: #6f8ba5; }
      #ui h2 { margin: 0; font-size: 26px; letter-spacing: .18em; font-weight: 700; }
      #ui h3 {
        margin: 0 0 6px; font-size: 13px; letter-spacing: .16em;
        font-weight: 400; color: #6f8ba5;
      }
      /* 【為什麼要一起選 #board】結算板的兩顆出口按鈕在 #board 裡而不是
         #ui 底下（它疊在戰鬥畫面上，不是一個畫面）。少了它們就是預設的
         系統按鈕，跟整個介面對不上 */
      #ui button, #board button {
        font: inherit; color: inherit; cursor: pointer;
        border: 1px solid #2b3f52; background: rgba(20, 32, 46, 0.9);
        padding: 10px 26px; letter-spacing: .16em;
      }
      #ui button:hover:not(:disabled), #board button:hover:not(:disabled) { border-color: #5a96d2; background: rgba(30, 50, 72, 0.95); }
      #ui button.primary, #board button.primary { border-color: #5a96d2; color: #eaf4ff; }
      #ui button.ghost, #board button.ghost { color: #8fa6bb; }
      #ui .cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
      #ui .card {
        display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
        min-width: 210px; padding: 16px 18px; text-align: left;
      }
      #ui .card-title { font-size: 17px; letter-spacing: .12em; }
      #ui .card-desc { font-size: 12px; color: #6f8ba5; letter-spacing: .06em; }
      #ui .card-meta { font-size: 12px; color: #6f8ba5; }
      /* 【disabled 要看得出來是 disabled】看起來可點卻沒反應，玩家會以為壞了。
         數量到上下限時的箭頭與未開放的任務卡都吃這一條 */
      #ui button:disabled, #board button:disabled { opacity: .38; cursor: default; }
      #ui .card .locked {
        align-self: flex-end; font-size: 11px; color: #8a6f4f; letter-spacing: .1em;
      }
      #ui .row { display: flex; gap: 12px; flex-wrap: wrap; }
      #ui .row button.sel { border-color: #5a96d2; color: #eaf4ff; }
      /* 場地設定那一列：兩組單選按鈕各配一個標籤，置中對齊 */
      #ui .picks { align-items: center; justify-content: center; gap: 10px; }
      #ui .picks .pick-label { font-size: 12px; color: #6f8ba5; letter-spacing: .1em; }
      #ui .picks .pick { display: inline-flex; gap: 6px; margin-right: 18px; }
      #ui .picks .pick button { padding: 5px 12px; font-size: 12px; letter-spacing: .08em; }
      /* 【要 justify-content 與固定寬度】自訂編組那一頁的兩欄裡各有一排
         機種按鈕與一片名單，內容寬度隨機種名字長短而變 —— 只給 min-width
         的話兩欄會各自長成不同寬度，而且會從畫面左緣溢出去 */
      #ui .two-col {
        display: flex; gap: 48px; align-items: flex-start; justify-content: center;
      }
      #ui .col { display: flex; flex-direction: column; gap: 10px; width: 380px; }
      /* 出戰名單：一架一個 chip，chip 裡是「選我」與「移除」兩顆 */
      #ui .roster {
        display: flex; gap: 8px; flex-wrap: wrap;
        min-height: 34px; align-content: flex-start;
      }
      #ui .chip { display: inline-flex; }
      #ui .chip button { padding: 5px 10px; font-size: 12px; letter-spacing: .08em; }
      /* 【玩家那一架要一眼看得出來】它同時是「我開的」與「該小隊的長機」 */
      #ui .chip button.me { border-color: #5a96d2; color: #eaf4ff; }
      /* 【敵方的卡片本體不可點，但不能用 disabled】那條規則把透明度壓到
         .38，一整排敵機看起來像壞掉的按鈕。這裡只是「沒有動作」*/
      #ui .chip button.static { pointer-events: none; }
      /* 【移除鍵與本體共用一條邊】兩顆看起來是同一個 chip 的兩半 */
      #ui .chip button.del { border-left: none; padding: 5px 9px; color: #9a7b7b; }
      #ui .chip button.del:hover:not(:disabled) { color: #e8b4b4; }
      #ui .stepper { display: flex; align-items: center; gap: 14px; }
      #ui .stepper button { padding: 6px 16px; }
      #ui .stepper .value {
        min-width: 3ch; text-align: center; font-size: 22px; color: #eaf4ff;
      }
      /* 【結算時 #board 要能點】按住 TAB 時它只是看，所以預設 pointer-events: none */
      /* 【字級要跟選單一致】#board 是 13px 的表格字，而按鈕 font: inherit */
      #board-actions {
        display: flex; gap: 14px; pointer-events: auto;
        font: 15px/1.6 ui-monospace, Consolas, "Noto Sans TC", sans-serif;
      }
      #board-actions[hidden] { display: none; }
      #board.finished { pointer-events: auto; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <canvas id="hud"></canvas>
    <div id="board" hidden>
      <div id="banner"></div>
      <div id="tables"></div>
      <div id="board-actions" hidden>
        <button class="primary" data-act="fight">再打一場</button>
        <!-- 兩個回頭的出口依模式擇一顯示（main.ts）。為什麼是兩顆按鈕而不是
             逐幀改 data-act：data-act 是選單那一層唯一的協定，改它等於讓一個
             DOM 屬性變成隱性狀態 -->
        <button class="ghost" data-act="toSetup">回設定頁</button>
        <button class="ghost" data-act="toMission" hidden>回任務列表</button>
      </div>
    </div>
    <div id="ui">
      <section id="landing" class="screen">
        <h1 class="title">CONTRAILS AIR: COMBAT</h1>
        <p class="subtitle">1944 · 空戰模擬</p>
        <button class="primary" data-act="start">開　始</button>
      </section>

      <section id="menu" class="screen" hidden>
        <div class="cards">
          <button class="card" data-act="mission">
            <span class="card-title">任務模式</span>
            <span class="card-desc">依陣營推進的劇情關卡</span>
          </button>
          <button class="card" data-act="skirmish">
            <span class="card-title">遭遇戰模式</span>
            <span class="card-desc">自訂雙方兵力的殲滅戰</span>
          </button>
        </div>
      </section>

      <section id="mission" class="screen" hidden>
        <h2>任務模式</h2>
        <div class="row" id="mission-factions"></div>
        <div class="cards" id="mission-list"></div>
        <button class="ghost" data-act="back">返　回</button>
      </section>

      <section id="skirmish" class="screen" hidden>
        <h2>遭遇戰</h2>
        <!-- 【為什麼沒有陣營選擇了】混搭上線之後兩隊各自的名單就是全部的
             設定，陣營不再是一個選擇（`battle/skirmish.ts` 的 ALL_SPECS）。
             任務模式那一頁仍然有，那裡的陣營決定的是打哪一組關卡 -->
        <div class="two-col">
          <div class="col">
            <h3>我方　點一下加一台，Shift ＋ 點加五台</h3>
            <div class="row" id="blue-add"></div>
            <h3 id="blue-head">我方出戰</h3>
            <div class="roster" id="blue-roster"></div>
          </div>
          <div class="col">
            <h3>敵方　點一下加一台，Shift ＋ 點加五台</h3>
            <div class="row" id="red-add"></div>
            <h3 id="red-head">敵方出戰</h3>
            <div class="roster" id="red-roster"></div>
          </div>
        </div>
        <!-- 【場地與高度為什麼在這裡】開場高度決定地形進不進得了場：
             島最高 1,000 m，而 4,000 m 的仗打下來最低只到 2,292 m -->
        <div class="row picks">
          <span class="pick-label">場　地</span><span class="pick" id="terrain-pick"></span>
          <span class="pick-label">開場高度</span><span class="pick" id="altitude-pick"></span>
        </div>
        <div class="row">
          <button class="primary" data-act="fight">開始戰鬥</button>
          <button class="ghost" data-act="back">返　回</button>
        </div>
      </section>

      <section id="pause" class="screen" hidden>
        <h2>已暫停</h2>
        <button class="primary" data-act="resume">繼　續</button>
        <button class="ghost" data-act="restart">重新開始</button>
        <button class="ghost" data-act="toMenu">回主選單</button>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
