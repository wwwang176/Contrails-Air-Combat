<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contrails Air: Combat</title>
    <!-- 【字體】每一個 family 都有系統回退：離線時退回系統字，不能白畫面 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      /* ══════════════════════════════════════════════════════════
         甲′「桌上的紙」（選單重做 spec §4）
         大面積是暗桌面，紙只給手拿得起來的東西（.paperbit）。
         全部元件只引用這些變數；換皮只動這一段。
         ══════════════════════════════════════════════════════════ */
      :root {
        --veil: 24, 20, 14;
        --panel: rgba(38, 32, 23, .93);
        /* 【戰報專用的薄底】它蓋在戰場上，厚底等於把剛打完的那一幕整個關掉 */
        --panel-thin: rgba(38, 32, 23, .74);
        --bd: #6b5b3f; --bd2: #7d6b4a; --rule: #4a3f2c;
        --ink: #e3d9c0; --dim: #a2937a; --strong: #f2e9d2;
        --sel: #b8543f;                 /* 印章紅：選中、強調 */
        --go-bg: #8c3a2b; --go-ink: #f7ecd2;
        --btn: #3b3123; --btn-hi: #473b2b;
        --card: linear-gradient(180deg, rgba(59, 49, 35, .9), rgba(46, 38, 27, .9));
        --paper: #c5b894; --paper-ink: #2f271c; --paper-dim: #574a35;   /* ≥ 4.5:1 */
        /* 疊在下面、還沒翻開的那幾份：同一種紙，只是壓在暗處 */
        --paper-back: #9d926f; --paper-tab: #8b8163;
        --mine: #a9c3d2; --foe: #d0a89a;                                 /* 我方／敵方的隊色 */
        --f-body: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
        --f-ui: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
        --f-title: 'Special Elite', 'Noto Serif TC', serif;
      }

      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e14; }
      canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      /* 【非有不可】上面那條 `canvas { display: block }` 是作者樣式，
         會壓過 [hidden] 的 UA 樣式 —— 少了這一行，選單期間 HUD 藏不起來 */
      #hud[hidden] { display: none; }

      /* ── 共用 ────────────────────────────────────────── */
      /* 【捲軸也是這張桌子的一部分】任務列表、機庫的卷宗架、結算名單都在捲，
         而作業系統那條亮灰捲軸貼在暗桌面上像一塊沒收拾乾淨的東西。
         兩套屬性都寫：`scrollbar-*` 是標準的，`::-webkit-scrollbar` 讓舊版
         WebKit 也吃得到，少了它在那些瀏覽器上會退回系統樣式 */
      * { scrollbar-width: thin; scrollbar-color: var(--bd) transparent; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: rgba(0,0,0,.22); }
      ::-webkit-scrollbar-thumb { background: var(--btn-hi); border: 1px solid var(--bd); }
      ::-webkit-scrollbar-thumb:hover { background: var(--bd2); }
      ::-webkit-scrollbar-corner { background: transparent; }
      /* 紙上的捲軸要用紙的色階 —— 暗的那一條壓在紙上像一道裂縫 */
      .paperbit { scrollbar-color: var(--paper-tab) rgba(47,39,28,.10); }
      .paperbit::-webkit-scrollbar-track { background: rgba(47,39,28,.10); }
      .paperbit::-webkit-scrollbar-thumb { background: var(--paper-tab); border-color: #8d7c56; }
      .paperbit::-webkit-scrollbar-thumb:hover { background: var(--paper-dim); }
      #ui, #board { font: 14px/1.65 var(--f-body); color: var(--ink); }
      #ui button, #board button { font: inherit; color: inherit; cursor: pointer; }
      #ui button:disabled, #board button:disabled { opacity: .38; cursor: default; }
      .btn {
        padding: 8px 16px; color: var(--ink); background: var(--btn);
        border: 1px solid var(--bd2); box-shadow: 0 3px 8px rgba(0,0,0,.5); letter-spacing: .02em;
      }
      .btn:hover:not(:disabled) { background: var(--btn-hi); }
      .btn.on { color: var(--strong); border-color: var(--sel); box-shadow: inset 0 -2px 0 var(--sel); }
      .btn.tiny { padding: 3px 8px; font-size: 12px; }
      .go {
        background: var(--go-bg); color: var(--go-ink); border: 1px solid var(--go-bg);
        font-weight: 700; padding: 12px 42px; font-size: 16px; letter-spacing: .1em;
        box-shadow: 0 4px 12px rgba(0,0,0,.5);
      }
      .lbl { font-size: 11px; letter-spacing: .06em; color: var(--dim); }
      /* 【返回一律在紙的左上角外側】不屬於任何一張紙，屬於這一頁；每頁同一個位置，
         標籤寫回到哪裡，不寫「返回」 */
      .pane { position: relative; }
      .back {
        position: absolute; top: -54px; left: 0; z-index: 3;
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 18px 10px 14px; color: var(--strong); background: var(--btn);
        border: 1px solid var(--bd2); box-shadow: 0 3px 8px rgba(0,0,0,.5);
      }
      .back::before { content: '‹'; font-size: 20px; line-height: 0; position: relative; top: -1px; }
      .back:hover { background: var(--btn-hi); border-color: var(--sel); }
      /* 【照片】來源不管是 Grok 生的還是引擎截的，過了這一層都是夾在卷宗裡的當年照片。
         **原檔是彩色的** —— 黑白是這一層 filter 做的，不是圖做的；滑過去
         `grayscale` 放到 .70，也就是還三成顏色回來 */
      .photo { position: relative; overflow: hidden; background: #1b1610; display: block; }
      .photo img { display: block; width: 100%; height: 100%; object-fit: cover;
        filter: grayscale(1) sepia(.26) contrast(1.06) brightness(.92);
        transition: filter .32s ease; }
      .photo::after { content: ''; position: absolute; inset: 0; pointer-events: none;
        box-shadow: inset 0 0 0 5px rgba(232,222,196,.9), inset 0 0 40px rgba(0,0,0,.35); }
      .tape { position: absolute; z-index: 2; width: 54px; height: 16px;
        background: rgba(214,200,160,.55); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
      .tape.tl { left: -14px; top: 10px; transform: rotate(-45deg); }
      .tape.br { right: -14px; bottom: 10px; transform: rotate(-45deg); }
      .stamp {
        position: absolute; top: 16px; right: 20px;
        font: 700 12px/1 var(--f-title); letter-spacing: .18em; color: var(--sel);
        border: 2px solid var(--sel); padding: 5px 9px; opacity: .85;
      }

      /* ── 畫面 ────────────────────────────────────────── */
      #ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
      /* 【每頁自己的遮罩濃度】--v 由 section 的 style 給：開場 .30、主選單 .50、其餘 .70。
         分界線是那一頁有沒有要讀的小字。不上 backdrop-filter —— 它是每幀全螢幕
         模糊，而選單期間 3D 還在跑 */
      #ui .screen {
        position: absolute; inset: 0; pointer-events: auto;
        display: flex; flex-direction: column; align-items: center; justify-content: safe center;
        gap: 22px; padding: 96px 24px 24px; overflow-y: auto;
        background: rgba(var(--veil), var(--v, .7));
      }
      #ui .screen[hidden] { display: none; }
      /* 【齒輪要自己開啟點擊】`#ui` 是 pointer-events: none，只有 .screen 例外 */
      .gear {
        /* 【層級】齒輪是彈窗的入口：壓在暫停那一段（10）之上，但在它自己打開的
           彈窗（50 起跳，兩個值都在 ui/menu.ts）之下 */
        position: fixed; top: 16px; right: 16px; z-index: 20; pointer-events: auto;
        display: flex; align-items: center; justify-content: center;
        width: 38px; height: 38px; padding: 0; color: var(--ink);
        background: var(--btn); border: 1px solid var(--bd2); box-shadow: 0 3px 8px rgba(0,0,0,.5);
      }
      .gear:hover { background: var(--btn-hi); color: var(--strong); }
      /* 暫停時的「教學」排在齒輪左邊，同一種按鈕；寬度跟著字 */
      .gear.help { right: 62px; width: auto; padding: 0 14px; font: 14px/1 var(--f-body); letter-spacing: .1em; }
      .gear[hidden] { display: none; }
      #recovery-worker-blocker {
        position: fixed; inset: 0; z-index: 10000; box-sizing: border-box;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; padding: 32px; text-align: center; color: var(--ink);
        background: rgba(20, 16, 11, .97); font: 16px/1.7 var(--f-body);
        pointer-events: auto;
      }
      #recovery-worker-blocker h1 { color: var(--sel); }
      #recovery-worker-blocker p { max-width: 680px; margin: 0; }
      h1, h2, h3 { margin: 0; font-family: var(--f-body); color: var(--strong); }
      h1 { font: 700 44px/1.15 var(--f-title); letter-spacing: .02em; }
      h2 { font-size: 17px; font-weight: 700; }
      /* 機種徽章：陣營章打底，機身側影壓在上面（簡報的編組列、編組頁的機種
         選單、機庫的卷宗架）。
         【側影用 mask 不用 img】圖檔只有 alpha，顏色由 `color` 決定 —— 同一份
         檔案在簡報頁是 currentColor、在機種選單是米白。
         【章在上、機身在下，框要裝得下兩個】章不跟機身同高才看得見（置中的話
         整枚埋在機身底下）。框高 = 機身 28 + 章露出來的 5 —— 框比內容矮的話
         外面那一層 `align-items: center` 會把整枚徽章對得偏上。
         【側影要 z-index】章是有顏色的實心圖形，不指定層次的話 SVG 會蓋在機身
         的座艙罩與垂尾上，飛機就變成只剩下半截 */
      .sil { position: relative; flex: none; width: 68px; height: 33px; }
      /* 【寬度讓 SVG 自己算】三面標誌的外框比例不一樣，寫死寬度會把星條徽壓扁 */
      .sil .mk { position: absolute; left: 50%; top: 0; transform: translateX(-50%);
        height: 20px; width: auto; opacity: .92; }
      .sil i { position: absolute; left: 0; right: 0; bottom: 0; height: 28px;
        z-index: 1; background: currentColor;
        -webkit-mask: var(--ac) center/contain no-repeat; mask: var(--ac) center/contain no-repeat; }

      /* ① 開場 */
      .cover { position: relative; padding: 26px 60px 22px; text-align: center; }
      .cover::after { content: ''; position: absolute; left: 22px; top: -1px; width: 8px; height: 8px;
        border-radius: 50%; background: rgba(0,0,0,.5); box-shadow: 30px 0 0 rgba(0,0,0,.5); }

      /* ①b 主選單 ／ ①c 陣營：直式卡 */
      .cards { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
      .tallcard { position: relative; width: 322px; padding: 0 0 18px; text-align: left;
        display: flex; flex-direction: column; background: var(--card); }
      .tallcard .photo { height: 292px; margin: 10px 10px 14px; }
      .tallcard .t { margin: 0 20px; font: 700 19px/1.2 var(--f-body); }
      .tallcard .d { margin: 6px 20px 0; font-size: 12.5px; }
      .tallcard .m { margin: 12px 20px 0; padding-top: 8px; border-top: 1px solid rgba(0,0,0,.18); font-size: 11px; }
      /* 【還 30% 的顏色】sepia 同時降下來 —— 不降的話那點顏色會被褐調吃掉 */
      .tallcard:hover .photo img { filter: grayscale(.7) sepia(.06) contrast(1.08) brightness(1); }
      #campaign .tallcard { width: 300px; }
      #campaign .tallcard .photo { height: 400px; }

      /* ①d 機庫 */
      /* 【只有這一頁不是整片遮罩】右半要看得到飛機。左邊那一段仍然要壓暗 ——
         紙下面是天空與海，不壓的話返回鍵與卷宗邊緣在亮海上會讀不出來 */
      /* 【靠左靠的是 align-items】`.screen` 是直向的 flex —— justify-content 在
         這裡管的是上下，拿它靠左只會把整頁推到畫面頂端 */
      /* 【只有這一頁不是整片遮罩】右邊要看得到天空。由左到右一路淡開，
         沒有任何一條邊界 —— 有邊界的話，內容帶在寬螢幕上置中之後，畫面
         左側會出現一道與版面無關的直線 */
      #ui .screen#hangar {
        background: linear-gradient(90deg, rgba(var(--veil), .6) 0%, rgba(var(--veil), 0) 100%);
      }
      /* 【滿版而不是只佔右半】拖曳要能從畫面上任何一處開始；卷宗蓋在它上面，
         所以拖在紙上不會轉鏡頭 */
      #hangar-view { position: absolute; inset: 0; cursor: grab; }
      #hangar-view:active { cursor: grabbing; }
      /* 【整頁是一條有上限的內容帶】不設上限的話，卷宗貼著視窗左緣、飛機
         貼著右緣 —— 螢幕愈寬兩者離愈遠，中間空一大片。飛機的位置由
         `.stage` 這個空格子決定（`showcase.ts` 量它的中心），所以它跟著
         內容帶走，不是跟著視窗走 */
      /* 【帶子本身不吃指標事件】它是一個橫跨整條的 flex 容器，蓋在
         #hangar-view 上面 —— 不關掉的話，飛機那半邊的按下與拖曳全都停在
         這一層，拖不動視角。要點的東西各自開回來 */
      .pane.hangar { z-index: 1; display: flex; align-items: stretch; gap: 12px;
        width: min(1280px, 100%); max-height: calc(100vh - 150px); pointer-events: none; }
      .pane.hangar > .rack, .pane.hangar > .sheet, .pane.hangar > .back { pointer-events: auto; }
      /* 飛機站的地方。只是一個量得到的空格子，不畫任何東西 */
      .stage { flex: 1; min-width: 0; }
      .rack { display: flex; flex-direction: column; gap: 5px; width: 200px; overflow-y: auto; }
      /* 【機種也是一份份的卷宗】與任務那一疊同一種東西，所以照用 .stop */
      /* 徽章在左、名字在右 —— 與編組頁的機種選單同一種排法 */
      .rack .stop { margin-bottom: 0; display: grid; grid-template-columns: 68px 1fr;
        gap: 9px; align-items: center; }
      .sheet { width: 386px; padding: 20px 22px 22px; overflow-y: auto; }
      .sheet h2 { font-size: 22px; }
      .sheet .story { margin: 13px 0 17px; font-size: 13px; }
      .bars { display: flex; flex-direction: column; gap: 8px; }
      .bars .stat { display: grid; grid-template-columns: 34px 1fr 76px; align-items: center; gap: 10px; }
      .bars .k { font-size: 11.5px; }
      /* 【條上要印真值】只比長短的話，讀者分不出「差一點」與「差一倍」 */
      .bars .v { text-align: right; font-weight: 700; font-size: 12px; }
      .bars .track { height: 9px; background: rgba(47,39,28,.14); border: 1px solid rgba(47,39,28,.3); }
      /* 【寬度由 menu.ts 在下一幀才寫】以 0 進 DOM、下一幀推到目標，換機種
         時四條一起長出來；轉場曲線尾端慢，讀得到「停在哪裡」 */
      .bars .track i { display: block; height: 100%; width: 0; background: var(--go-bg);
        transition: width .5s cubic-bezier(.22,.7,.25,1); }
      .sheet .facts { display: grid; grid-template-columns: 1fr; gap: 5px;
        margin-top: 17px; padding-top: 13px; border-top: 1px solid rgba(47,39,28,.24); }
      .sheet .fact { display: grid; grid-template-columns: 62px 1fr; font-size: 12px; }

      /* ② 簡報 */
      .brief { display: grid; grid-template-columns: 300px 1fr; width: min(1120px, 96vw);
        background: var(--panel); border: 1px solid var(--bd); box-shadow: 0 16px 34px rgba(0,0,0,.6); }
      .brief > .left { padding: 18px; border-right: 1px solid var(--rule); }
      /* 【右欄是直向的 flex】「出擊」釘在右下角，靠的是 `.actions { margin-top: auto }`
         —— 內容短的時候它照樣沉到底 */
      .brief > .right { position: relative; display: flex; flex-direction: column;
        padding: 20px 24px; min-height: 470px; }
      .camphead { margin: 2px 0 18px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
      .camphead .cn { font: 700 24px/1.2 var(--f-body); color: var(--strong); }
      /* 【一疊文件，不是時間軸】沒有圓點也沒有虛線，三關就是三份紙；每一份左緣
         那一條是它的頁籤，**選中的那一關轉紅**。三份的幾何一樣 —— 沒選到的不縮
         短，選到的也不左滑 */
      .route { position: relative; }
      .stop { position: relative; width: 100%; text-align: left;
        padding: 9px 12px 9px 18px; margin-bottom: 5px; }
      /* 【比 .paperbit 高一階】那一塊在樣式表最後面，但這一條是兩個類別選擇器 */
      .stop:not(.on) { background-color: var(--paper-back); }
      .stop::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
        background: var(--paper-tab); }
      .stop.on::before { background: var(--sel); }
      .stop .k { font-size: 10.5px; letter-spacing: .1em; }
      .stop .n { font-weight: 700; }
      .stop.soon .n, .stop.soon .k { opacity: .58; }
      .stop .soonmark { font-size: 10.5px; color: #6d5c3c; }
      .obj { font: 700 15px/1.4 var(--f-body); color: #cbb98d; border-left: 3px solid #cbb98d;
        padding-left: 11px; margin: 4px 0 16px; }
      .forces { display: grid; grid-template-columns: 1fr 60px 1fr; align-items: start;
        padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
      .forces .vs { align-self: center; text-align: center; color: var(--dim); font-weight: 700; }
      .unit { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
      .unit .nm { font-weight: 700; color: var(--strong); }
      .unit .qty { font-size: 12px; color: var(--dim); }
      .facts { display: flex; gap: 26px; margin-top: 14px; flex-wrap: wrap; }
      .fact .v { font-weight: 700; color: var(--strong); }
      .soonbox { padding: 24px 20px; background: rgba(0,0,0,.10); border: 1px dashed var(--bd2); color: var(--dim); }
      .brief .actions { display: flex; justify-content: flex-end; margin-top: auto; padding-top: 22px; }

      /* ③ 編組 */
      .board { width: min(1180px, 96vw); padding: 22px 26px 24px; font-family: var(--f-ui);
        background: var(--panel); border: 1px solid var(--bd); box-shadow: 0 16px 34px rgba(0,0,0,.6); }
      .board .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; }
      .board .head h2 { font-family: var(--f-body); font-size: 21px; }
      .board .head .sub { color: var(--dim); font-size: 12px; }
      .board .presets { margin-left: auto; display: flex; gap: 8px; align-items: center; }
      .sides { display: grid; grid-template-columns: 1fr 128px 1fr; align-items: start; }
      .side { display: flex; flex-direction: column; gap: 8px; }
      .side > header { display: flex; align-items: baseline; gap: 10px; }
      .side h3 { font-size: 15px; font-weight: 700; }
      .side.mine h3 { color: var(--mine); }
      .side.foe h3 { color: var(--foe); }
      .side .count { margin-left: auto; font-size: 20px; font-weight: 700; color: var(--strong); }
      .side .count small { font-size: 11px; font-weight: 400; color: var(--dim); }
      .flight { display: grid; grid-template-columns: 26px 1fr auto auto; gap: 10px; align-items: center;
        padding: 9px 11px; background: var(--card); border: 1px solid var(--bd2); box-shadow: 1px 3px 5px rgba(0,0,0,.42); }
      /* 【我帶的那一隊是紙】它是我手上那張卡 —— 整頁只有這一塊亮面。
         不轉角度：遊戲裡的文字一律不歪斜 */
      .flight .pick { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--dim);
        background: transparent; padding: 0; display: grid; place-items: center; }
      .flight.lead .pick { border-color: var(--sel); }
      .flight.lead .pick::after { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--sel); }
      .flight .nm { font-weight: 700; color: var(--strong); white-space: nowrap; }
      .flight .nm .full { font-weight: 400; color: var(--dim); }
      .flight.lead .nm, .flight.lead .qty .n { color: #221c12; }
      .flight.lead .nm .full, .flight.lead .meta { color: var(--paper-dim); }
      .flight .meta { font-size: 11px; color: var(--dim); }
      .flight .dots { display: flex; gap: 3px; }
      .flight .dots i { width: 9px; height: 11px; background: var(--bd2); display: block;
        clip-path: polygon(50% 0, 100% 100%, 50% 78%, 0 100%); }
      .flight .dots i.on { background: #cbb98d; }
      .side.foe .flight .dots i.on { background: var(--foe); }
      .flight.lead .dots i { background: #a89673; }
      .flight.lead .dots i.on { background: #2f271c; }
      .flight .qty { display: flex; align-items: center; gap: 6px; }
      .flight .qty .n { min-width: 2ch; text-align: center; font-weight: 700; color: var(--strong); }
      .flight.lead .btn { color: #2f271c; background: #cfc09b; border-color: #8d7c56; box-shadow: none; }
      .flight .rm { color: #c98a78; border-color: #6b4a3f; }
      .flight.lead .rm { color: var(--go-bg); border-color: #a08066; }
      .palette { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
      .palette[hidden] { display: none; }
      .plane { display: grid; grid-template-columns: 68px 1fr; gap: 9px; align-items: center;
        padding: 7px 9px; text-align: left; background: #2a2219; border: 1px solid var(--bd); }
      .plane:hover { border-color: var(--sel); background: #342c20; }
      .plane .sil { color: #b0a28a; }
      /* 【兩列各自是一個 div】用 `<br>` 的話兩列共用行高，字級差一半的兩行
         中間會撐出一道空白 */
      .plane .nm { font-weight: 700; font-size: 13px; line-height: 1.3; color: var(--strong); }
      /* 國家前綴：認得出是誰的機，但不跟機種名搶 */
      .plane .nm i { font-style: normal; font-weight: 400; color: var(--dim); }
      .plane .st { font-size: 10.5px; line-height: 1.3; color: var(--dim); margin-top: 2px; }
      .versus { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 42px; }
      .versus .vs { font: 700 15px/1 var(--f-body); color: var(--dim); }
      .versus .bar { width: 14px; height: 190px; background: #2a2219; border: 1px solid var(--bd); position: relative; }
      .versus .bar i { position: absolute; left: 0; right: 0; display: block; }
      .versus .bar .m { top: 0; background: #6f8490; }
      .versus .bar .f { bottom: 0; background: #8a6658; }
      .versus .odds { font-size: 11px; color: var(--dim); text-align: center; line-height: 1.5; }
      .versus .odds b.m { color: var(--mine); } .versus .odds b.f { color: var(--foe); }
      .setup { display: flex; flex-wrap: wrap; gap: 20px 34px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--rule); }
      .opt { display: flex; gap: 8px; }
      .opt button { padding: 7px; background: #2a2219; border: 1px solid var(--bd); color: var(--ink);
        display: flex; flex-direction: column; align-items: center; gap: 5px; width: 92px; }
      .opt.narrow button { width: 70px; }
      .opt button.on { border-color: var(--sel); box-shadow: inset 0 -2px 0 var(--sel); }
      .opt button span { font-size: 11.5px; }
      .opt button small { font-size: 10px; color: var(--dim); }
      .foot { display: flex; align-items: center; gap: 16px; margin-top: 18px; }
      .foot .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }

      /* 暫停 */
      #pause { gap: 14px; }
      #pause h2 { font-size: 26px; }
      /* 放棄任務的確認：問句要有一個框，與結算板同一種面板 */
      .ask { display: flex; flex-direction: column; align-items: center; gap: 22px;
        min-width: 340px; padding: 26px 40px 28px;
        background: var(--panel-thin); border: 1px solid var(--bd); box-shadow: 0 16px 34px rgba(0,0,0,.6); }
      .ask h2 { font-size: 22px; }
      .ask .row { display: flex; gap: 14px; }
      /* 進場教學：截圖在左、說明在右；窄螢幕上下疊 */
      /* 【厚底】卡片後面是剛開場的戰場，任務橫幅正打到一半 —— 薄底會讓那幾個字透到標題上 */
      .ask.tut { width: min(820px, 94vw); align-items: stretch; gap: 16px; padding: 22px 26px 24px;
        background: var(--panel); }
      .ask.tut h2 { text-align: center; }
      .ask.tut .go { align-self: center; }
      /* 一排幾格：圖在上、一句話在下 */
      .tut-panels { list-style: none; margin: 0; padding: 0; display: flex; gap: 16px; justify-content: center; }
      .tut-panel { flex: 1 1 0; max-width: 240px; display: flex; flex-direction: column; gap: 10px; }
      /* 【標籤以圖的百分比定位】圖縮放時跟著走 */
      .tut-fig { position: relative; margin: 0; border: 1px solid var(--bd); }
      .tut-fig img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
      .tut-tag { position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
        padding: 2px 8px; font: 700 12px/1.4 var(--f-ui); color: var(--go-ink); background: var(--sel);
        box-shadow: 0 2px 6px rgba(0,0,0,.6); }
      .tut-cap { font-size: 14px; line-height: 1.6; color: var(--strong); }
      @media (max-width: 720px) { .tut-panels { flex-direction: column; align-items: center; } }

      /* ── 戰報 #board ────────────────────────────────── */
      #board {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 0;
        background: rgba(var(--veil), .46); pointer-events: none; overflow-y: auto;
      }
      #board[hidden] { display: none; }
      /* 【結算時 #board 要能點】按住 TAB 時它只是看，所以預設 pointer-events: none */
      #board.finished { pointer-events: auto; }
      .aar { position: relative; width: min(760px, 96vw); padding: 22px 26px 24px;
        background: var(--panel-thin); border: 1px solid var(--bd); box-shadow: 0 16px 34px rgba(0,0,0,.6); }
      #banner { font: 700 30px/1.2 var(--f-body); color: var(--strong); letter-spacing: .04em; }
      #banner:empty { display: none; }
      #aar-sub { font-size: 13px; color: var(--dim); margin-top: 3px; }
      #aar-sub[hidden], #aar-me[hidden], #aar-tally[hidden] { display: none; }
      #aar-me { display: grid; grid-template-columns: 1fr repeat(4, auto); gap: 22px; align-items: center;
        margin: 18px 0; padding: 15px 18px; }
      #aar-me .who .n { font: 700 18px/1.2 var(--f-body); }
      #aar-me .who .s { font-size: 11.5px; }
      #aar-me .stat { text-align: center; }
      #aar-me .stat .v { font: 700 26px/1 var(--f-body); }
      #aar-me .stat .k { font-size: 10.5px; margin-top: 3px; }
      /* 【橫的，不是三行】三組數字並排成一列。排成 a|k|b 的三列網格光這一塊就要
         80 px 高，而戰報下面還有玩家卡與完整名單 */
      #aar-tally { display: flex; justify-content: space-around; align-items: baseline;
        flex-wrap: wrap; gap: 10px 26px; padding: 9px 0;
        border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
      #aar-tally .item { display: flex; align-items: baseline; gap: 9px; }
      #aar-tally .a { font-weight: 700; color: var(--mine); }
      #aar-tally .b { font-weight: 700; color: var(--foe); }
      #aar-tally .k { font-size: 11px; color: var(--dim); }
      /* 【名單不收合】戰報就是要看這張表（雙方全部機體逐架列出），把它藏在一個
         要再點一下的開關後面沒有道理 */
      #aar-details { margin-top: 14px; }
      #aar-details .cap { font-size: 12.5px; color: var(--dim); }
      /* 【按住 TAB 的即時看板】沒有戰報的其餘區塊，連標題都不用 */
      #aar-details.bare .cap { display: none; }
      #tables { display: flex; gap: 28px; align-items: flex-start; justify-content: center; margin-top: 10px; }
      #board table { border-collapse: collapse; min-width: 300px; font-size: 12.5px; }
      #board caption { text-align: left; padding-bottom: 4px; font-weight: 700; }
      #board table.blue caption { color: var(--mine); }
      #board table.red caption { color: var(--foe); }
      #board th { text-align: right; font-weight: 400; color: var(--dim); border-bottom: 1px solid var(--rule); padding: 3px 8px; }
      #board th.name, #board td.name { text-align: left; }
      #board td { padding: 2px 8px; text-align: right; }
      #board tr.dead { opacity: .55; }
      #board tr.me { background: rgba(0,0,0,.14); color: var(--strong); }
      #board-actions { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; pointer-events: auto; }
      #board-actions[hidden] { display: none; }

      /* ══ 紙塊 ══ 放在最後：它要蓋過每個元件自己的暗底（.tallcard／.flight／.stop／#aar-me）
         —— 「有厚度、可以蓋章」的東西是紙，不管它原本是什麼元件 */
      .paperbit {
        background: var(--paper);
        background-image: repeating-linear-gradient(0deg, rgba(120,100,70,.05) 0 2px, transparent 2px 4px);
        color: var(--paper-ink); border: 1px solid #8d7c56; box-shadow: 0 4px 12px rgba(0,0,0,.55);
      }
      .paperbit .lbl, .paperbit .d, .paperbit .m, .paperbit .s, .paperbit .k,
      .paperbit .full, .paperbit .meta { color: var(--paper-dim); }
      .paperbit .t, .paperbit .n, .paperbit .v, .paperbit .nm { color: #221c12; }
      /* 【紙上的機身要是墨色】側影吃 `currentColor`，落在紙上還用暗底的米白
         就等於白紙上寫白字 */
      .paperbit .sil { color: var(--paper-ink); }

      /* ══ 載入畫面 ══ 暗桌面上一張整備單。開場就蓋著（模型預載完才收），進關卡時
         再叫出來（`ui/loading.ts`）。層級在所有選單與設定彈窗之上、Worker 失效的
         阻擋畫面之下 */
      #loading {
        position: fixed; inset: 0; z-index: 9000; box-sizing: border-box;
        display: flex; align-items: center; justify-content: center; padding: 24px;
        background: rgb(var(--veil));
        background-image: radial-gradient(ellipse at 50% 42%, rgba(70, 58, 40, .45), transparent 70%);
        font: 14px/1.65 var(--f-body); pointer-events: auto;
      }
      #loading[hidden] { display: none; }
      /* 【只有進度條與狀態】紙片只是底，不放標題與章 */
      .load-sheet {
        position: relative; width: min(340px, 100%); box-sizing: border-box;
        padding: 16px 20px 12px; transform: rotate(-.6deg);
      }
      /* 墨色的進度條，底下每一成一道刻度 —— 像填表格時的量尺 */
      .load-bar {
        position: relative; height: 10px; border: 1px solid var(--paper-ink);
        background: repeating-linear-gradient(90deg,
          transparent 0 calc(10% - 1px), rgba(47, 39, 28, .28) calc(10% - 1px) 10%);
      }
      /* 【過渡要比停留短】頭尾各停 0.1 秒，比它長的話條還沒長滿畫面就收了 */
      #loading-fill {
        display: block; height: 100%; width: 0;
        background: repeating-linear-gradient(135deg, var(--paper-ink) 0 5px, #3d3325 5px 10px);
        transition: width .08s ease;
      }
      .load-row {
        display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
        margin-top: 8px; font: 11px/1.4 var(--f-title); letter-spacing: .08em; color: var(--paper-dim);
      }
      #loading-pct { color: var(--sel); font-weight: 700; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <canvas id="hud"></canvas>

    <!-- 載入畫面：一開始就蓋著，預載完才收（main.ts）。不加 hidden —— 模型還沒
         載完時選單不能點 -->
    <div id="loading" role="status" aria-live="polite">
      <div class="load-sheet paperbit">
        <div class="load-bar"><i id="loading-fill"></i></div>
        <div class="load-row"><span id="loading-step">準備中</span><span id="loading-pct">0%</span></div>
      </div>
    </div>

    <div id="board" hidden>
      <div class="aar">
        <div id="banner"></div>
        <div id="aar-sub" hidden></div>
        <div id="aar-me" class="paperbit" hidden></div>
        <div id="aar-tally" hidden></div>
        <div id="aar-details">
          <div class="cap">完整名單</div>
          <div id="tables"></div>
        </div>
        <div id="board-actions" hidden>
          <!-- 兩個回頭的出口依模式擇一顯示（main.ts）。為什麼是兩顆按鈕而不是
               逐幀改 data-act：data-act 是選單那一層唯一的協定，改它等於讓一個
               DOM 屬性變成隱性狀態 -->
          <button class="btn" data-act="toSetup">回設定頁</button>
          <button class="btn" data-act="toMission" hidden>回任務列表</button>
          <button class="go" data-act="fight">再打一場</button>
        </div>
      </div>
    </div>

    <div id="ui">
      <!-- ① 開場：遮罩 30%。獨立一頁，不併進主選單 -->
      <section id="landing" class="screen" style="--v:.30">
        <div class="cover paperbit"><h1>CONTRAILS AIR: COMBAT</h1></div>
        <button class="go" data-act="start" style="padding:14px 54px">開始遊戲</button>
      </section>

      <!-- ①b 主選單：遮罩 50%。狀態行由 menu.ts 算出來填 -->
      <!-- 設定的入口。固定在右上角，所有畫面共用一顆；飛行中指標被鎖定、
           點不到任何按鈕，那時由 menu.ts 自己藏起來 -->
      <button id="gear" class="gear" data-act="settings" title="設定" aria-label="設定">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M12 2.6v2.3M12 19.1v2.3M21.4 12h-2.3M4.9 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6L17 17M7 7L5.4 5.4"/>
        </svg>
      </button>
      <!-- 暫停時重看教學。只在暫停選單開著、這一場有卡可看時出現（ui/menu.ts） -->
      <button id="help" class="gear help" data-act="help" hidden>教學</button>
      <section id="menu" class="screen" style="--v:.50" hidden>
        <div class="cards">
          <button class="tallcard paperbit" data-act="mission">
            <span class="photo"><i class="tape tl"></i><img src="/ui/mission.jpg" alt=""></span>
            <span class="t">任務模式</span>
            <span class="d">參與史實戰役</span>
          </button>
          <button class="tallcard paperbit" data-act="skirmish">
            <span class="photo"><i class="tape br"></i><img src="/ui/skirmish.jpg" alt=""></span>
            <span class="t">遭遇戰</span>
            <span class="d">建立自己的戰役</span>
          </button>
          <button class="tallcard paperbit" data-act="hangar">
            <span class="photo"><i class="tape tl"></i><img src="/ui/hangar.jpg" alt=""></span>
            <span class="t">機庫</span>
            <span class="d">檢視每一架飛機</span>
          </button>
        </div>
      </section>

      <!-- ①d 機庫：不上遮罩，右半整片留給飛機。左欄自己帶一層由深到透的底 -->
      <section id="hangar" class="screen" style="--v:0" hidden>
        <!-- 拖曳轉視角吃在這一塊上（src/app/showcase.ts 自己掛監聽器）。
             它在卷宗底下，所以拖到紙上不會轉鏡頭 -->
        <div id="hangar-view"></div>
        <div class="pane hangar">
          <button class="back" data-act="back">主選單</button>
          <div class="rack" id="hangar-rack"></div>
          <div class="sheet paperbit" id="hangar-sheet"></div>
          <div class="stage" id="hangar-stage"></div>
        </div>
      </section>

      <!-- ①c 陣營：遮罩 60%。三張卡由 menu.ts 畫 -->
      <section id="campaign" class="screen" style="--v:.60" hidden>
        <div class="pane">
          <button class="back" data-act="back">主選單</button>
          <div class="cards" id="campaign-cards"></div>
        </div>
      </section>

      <!-- ② 簡報：遮罩 70%。左欄路線、右欄簡報，沒有陣營分頁 -->
      <section id="mission" class="screen" style="--v:.70" hidden>
        <div class="pane">
          <button class="back" data-act="back">陣營</button>
          <div class="brief">
            <div class="left">
              <div class="camphead">
                <div class="cn" id="camp-name"></div>
              </div>
              <div class="route" id="route"></div>
            </div>
            <div class="right" id="brief"></div>
          </div>
        </div>
      </section>

      <!-- ③ 編組：遮罩 72%，整頁都是要讀的字 -->
      <section id="skirmish" class="screen" style="--v:.72" hidden>
        <div class="pane">
          <button class="back" data-act="back">主選單</button>
          <div class="board">
            <div class="head">
              <h2>出擊編組</h2>
              <span class="sub">最多五個小隊，每隊四架</span>
              <div class="presets"><span class="lbl">想定</span><span id="sk-presets"></span></div>
            </div>
            <div class="sides">
              <section class="side mine" id="sk-mine"></section>
              <div class="versus" id="sk-versus"></div>
              <section class="side foe" id="sk-foe"></section>
            </div>
            <div class="setup">
              <div><div class="lbl" style="margin-bottom:7px">戰場</div><div class="opt" id="sk-terrain"></div></div>
              <div><div class="lbl" style="margin-bottom:7px">開場高度</div><div class="opt" id="sk-alt"></div></div>
              <div><div class="lbl" style="margin-bottom:7px">時段</div><div class="opt narrow" id="sk-tod"></div></div>
            </div>
            <div class="foot">
              <div class="right"><button class="go" data-act="fight">戰　鬥</button></div>
            </div>
          </div>
        </div>
      </section>

      <section id="pause" class="screen" style="--v:.55" hidden>
        <h2>已暫停</h2>
        <button class="go" data-act="resume">繼　續</button>
        <button class="btn" data-act="restart">重新開始</button>
        <!-- 兩個出口依模式擇一顯示（main.ts）：遭遇戰回主選單，任務先問過
             再回該陣營的任務表。理由與結算板相同：不逐幀改 data-act -->
        <button class="btn" data-act="toMenu">回主選單</button>
        <button class="btn" data-act="abandon" hidden>放棄任務</button>
      </section>
      <!-- 放棄任務的確認。疊在暫停之上，menu.ts 自己開關 -->
      <section id="confirm" class="screen" style="--v:.60" hidden>
        <div class="ask">
          <h2>是否放棄進度？</h2>
          <div class="row">
            <button class="go" data-act="abandonNo">繼續任務</button>
            <button class="btn" data-act="abandonYes">放棄任務</button>
          </div>
        </div>
      </section>
      <!-- 重新開始的確認。與放棄任務同一類：疊在暫停之上，menu.ts 自己開關 -->
      <section id="restart-confirm" class="screen" style="--v:.60" hidden>
        <div class="ask">
          <h2>要重新開始這一場嗎？</h2>
          <div class="row">
            <button class="go" data-act="restartNo">繼　續</button>
            <button class="btn" data-act="restartYes">重新開始</button>
          </div>
        </div>
      </section>
      <!-- 進場教學。出擊後第一幀畫完就暫停彈出；內容由 menu.ts 依 ui/tutorials.ts 填 -->
      <section id="tutorial" class="screen" style="--v:.55" hidden>
        <div class="ask tut">
          <h2 id="tut-title"></h2>
          <ol id="tut-panels" class="tut-panels"></ol>
          <button class="go" data-act="tutorialOk">了　解</button>
        </div>
      </section>
      <!-- 回主選單的確認。遭遇戰的出口，與放棄任務同一類 -->
      <section id="menu-confirm" class="screen" style="--v:.60" hidden>
        <div class="ask">
          <h2>要離開這一場回主選單嗎？</h2>
          <div class="row">
            <button class="go" data-act="toMenuNo">繼　續</button>
            <button class="btn" data-act="toMenuYes">回主選單</button>
          </div>
        </div>
      </section>
      <!-- 設定。與暫停、確認同一類：overlay，不是畫面（見 ui/screens.ts）。
           齒輪在右上角固定位置，任何畫面都按得到 -->
      <section id="settings" class="screen" style="--v:.60" hidden>
        <div class="ask">
          <h2>設定</h2>
          <div>
            <div class="lbl" style="margin-bottom:7px">畫質</div>
            <!-- 只調 3D 那張畫布的解析度；HUD 是另一張 2D 畫布，維持原生清晰度 -->
            <div class="opt narrow" id="set-quality"></div>
          </div>
          <div>
            <div class="lbl" style="margin-bottom:7px">抗鋸齒</div>
            <!-- 建立 WebGL context 時才決定得了，所以改它要重新載入 -->
            <div class="opt narrow" id="set-aa"></div>
          </div>
          <div>
            <div class="lbl" style="margin-bottom:7px">音量</div>
            <div class="opt narrow" id="set-volume"></div>
          </div>
          <!-- 【選了不算數，按確定才套用】要重新載入的項目得先問過；
               改一下就立刻重整會讓玩家在毫無預期之下丟掉進行中的戰鬥 -->
          <div class="row">
            <button class="go" data-act="settingsApply">確　定</button>
            <button class="btn" data-act="settingsCancel">取　消</button>
          </div>
        </div>
      </section>
      <!-- 需要重新載入才生效的設定，套用前的最後一問。疊在設定之上 -->
      <section id="reload-ask" class="screen" style="--v:.60" hidden>
        <div class="ask">
          <h2>需要重新載入</h2>
          <div class="lbl">抗鋸齒要重新載入才會生效，進行中的戰鬥會遺失。</div>
          <div class="row">
            <button class="go" data-act="reloadYes">儲存並重新載入</button>
            <button class="btn" data-act="reloadNo">取消</button>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
