# 推到 main 就建置並發佈到 GitHub Pages。
#
# 網站在 https://<user>.github.io/Contrails-Air-Combat/ —— 子路徑由
# vite.config.ts 的 base 決定。第一次使用要到 repo 的
# Settings → Pages → Build and deployment 把 Source 設成「GitHub Actions」。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只發佈一次；連續推送時取消還在排隊的舊版本
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm run build = tsc --noEmit、建遊戲、再建工具頁（見 vite.config.ts 的
      # input），型別錯誤會讓發佈失敗
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
